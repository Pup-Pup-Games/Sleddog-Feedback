labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Something broken?** File a
        [bug report](https://github.com/Pup-Pup-Games/Sleddog-Feedback/issues/new?template=bug_report.yml)
        instead — it goes straight onto the board.

        **Anything about your account, payment, or personal data?** This page is
        public and permanent. Use the [contact form](https://sleddog.tools/contact)
        and we'll handle it privately.

  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
      description: >
        What you're trying to get done at the table, not just the button you're
        stuck on. The situation usually points at a better answer than the
        question does.
      placeholder: >
        We're splitting the party for a season and I can't work out how supplies
        are meant to be tracked for the group that stays behind.
    validations:
      required: true

  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - Stonetop
        - Forged in the Dark
        - Not system-specific
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: At the bottom of every page in the app. Leave blank if you're not sure.

  - type: checkboxes
    id: privacy
    attributes:
      label: Before you post
      options:
        - label: This post contains no account details, email address, or payment information.
          required: true
